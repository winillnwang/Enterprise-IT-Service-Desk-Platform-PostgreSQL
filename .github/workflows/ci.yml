name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_NAME: enterprise_it_service_desk_db
      DB_USER: enterprise_it_service_desk_user
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates

          sudo install -d /usr/share/postgresql-common/pgdg

          sudo wget --quiet \
            -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          . /etc/os-release

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18

          sudo pg_ctlcluster 18 main stop || true

          sudo pg_lsclusters --no-header \
            | awk '$3 == "5432" && $4 == "online" { print $1, $2 }' \
            | while read version cluster; do
                sudo pg_ctlcluster "$version" "$cluster" stop
              done

          sudo sed -i 's/^port = .*/port = 5432/' \
            /etc/postgresql/18/main/postgresql.conf

          sudo pg_ctlcluster 18 main start

          pg_isready --host 127.0.0.1 --port 5432

          PG_MAJOR_VERSION="$(sudo -u postgres psql \
            --port=5432 \
            --tuples-only \
            --no-align \
            --command "SELECT current_setting('server_version_num')::integer / 10000;")"

          echo "PostgreSQL major version: ${PG_MAJOR_VERSION}"
          test "$PG_MAJOR_VERSION" = "18"

          sudo -u postgres psql \
            --command "CREATE ROLE enterprise_it_service_desk_user WITH LOGIN PASSWORD 'ci-only-password' CREATEDB;"

          sudo -u postgres createdb \
            --owner=enterprise_it_service_desk_user \
            enterprise_it_service_desk_db

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest -v
